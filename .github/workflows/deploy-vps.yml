name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY repository secret"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS repository secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/portfolio_vps_actions
          chmod 600 ~/.ssh/portfolio_vps_actions
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST repository secret"; exit 1; }
          ssh -i ~/.ssh/portfolio_vps_actions -o BatchMode=yes "portfolio-vm@$VPS_HOST" \
            "cd /var/www/portfolio && git pull --ff-only origin main && SITE_ADDRESS='$VPS_HOST' PORT=80 HTTPS_PORT=443 docker compose up -d --build --remove-orphans"